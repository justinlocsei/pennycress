name: Run a bundle exec command

on:
  workflow_call:
    inputs:
      command:
        description: The command to run
        required: true
        type: string
      label:
        description: A label for the job
        required: true
        type: string
      ruby-version:
        description: The Ruby version to use
        required: true
        type: string
      setup:
        description: Run bin/setup before the command
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    name: Run
    runs-on: ubuntu-24.04

    steps:
      - name: Clone Pennycress
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true

      - name: Set up Pennycress
        if: inputs.setup
        run: bin/setup

      - name: ${{ inputs.label }}
        run: bundle exec ${{ inputs.command }}
